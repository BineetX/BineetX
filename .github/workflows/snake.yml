name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0D9488
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only generated SVGs are published to the separate output branch.
      - name: Publish animation files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
