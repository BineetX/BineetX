<svg xmlns="http://www.w3.org/2000/svg" width="420" height="90" viewBox="0 0 420 90" role="img" aria-labelledby="title desc">
<title id="title">MyoCircBase</title><desc id="desc">MyoCircBase. Select to open the repository. Animated decorative header.</desc>
<style>
.orbit{transform-origin:344px 45px;animation:orbit 24s linear infinite}
.wave{stroke-dasharray:12 5 2 5;animation:wave 5s linear infinite}
.rim{stroke-dasharray:100 1900;animation:rim 18s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes wave{to{stroke-dashoffset:-144}}
@keyframes rim{to{stroke-dashoffset:-2000}}
@media(prefers-reduced-motion:reduce){.orbit,.wave,.rim{animation:none}}
</style>
<defs>
 <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#152132"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7DD3FC" stop-opacity=".12"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
 <clipPath id="screen"><rect x="14" y="90" width="392" height="20" rx="8"/></clipPath>
</defs>
<rect x=".5" y=".5" width="419" height="89" rx="16" fill="url(#surface)" stroke="#253347"/>
<path class="rim" d="M 24 1 H 396" fill="none" stroke="#7DD3FC" opacity=".4"/>
<ellipse cx="344" cy="45" rx="62" ry="42" fill="url(#glow)"/>
<text x="22" y="27" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">03</text>
<text x="20" y="65" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="-1">MyoCircBase</text>
<g class="orbit"><ellipse cx="344" cy="45" rx="23" ry="12.65" transform="rotate(0 344 45)" fill="none" stroke="#7DD3FC" opacity=".65"/><ellipse cx="344" cy="45" rx="23" ry="12.65" transform="rotate(60 344 45)" fill="none" stroke="#7DD3FC" opacity=".65"/><ellipse cx="344" cy="45" rx="23" ry="12.65" transform="rotate(120 344 45)" fill="none" stroke="#7DD3FC" opacity=".65"/></g><circle cx="344" cy="45" r="3" fill="#7DD3FC"/>

</svg>
