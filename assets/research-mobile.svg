<svg xmlns="http://www.w3.org/2000/svg" width="420" height="426" viewBox="0 0 420 426" role="img" aria-labelledby="title desc">
<title id="title">Research directions</title><desc id="desc">Graph learning, drug-combination prediction, mathematical modelling, and reproducible workflows.</desc>
<style>
  .globe { transform-origin: 799px 181px; animation: orbit 45s linear infinite; }
  .rotor { transform-origin: 776px 74px; animation: orbit 24s linear infinite; }
  .reverse { animation-direction: reverse; animation-duration: 32s; }
  .signal { animation: signal 4s ease-in-out infinite alternate; }
  .flow { stroke-dasharray: 18 7 2 7; animation: flow 6s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes signal { from { opacity: .3; } to { opacity: 1; } }
  @keyframes flow { to { stroke-dashoffset: -204; } }
  @media (prefers-reduced-motion: reduce) { .globe, .rotor, .signal, .flow { animation: none; } }
</style>
<rect x=".5" y=".5" width="419" height="425" rx="6" fill="#0D1117" stroke="#253347"/>
<text x="24" y="29" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">01 / REPRESENT</text><text x="24" y="63" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">Learning on graphs</text><text x="24" y="91" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Neural networks</text><text x="24" y="113" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Biological knowledge graphs</text><circle cx="371" cy="29" r="4" fill="#7DD3FC" /><circle cx="371" cy="29" r="10" fill="none" stroke="#487891"/><line x1="24" y1="142" x2="396" y2="142" stroke="#253347" /><text x="24" y="171" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">02 / PREDICT</text><text x="24" y="205" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">Drug combinations</text><text x="24" y="233" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Multimodal learning</text><text x="24" y="255" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Synergy prediction</text><circle cx="371" cy="171" r="4" fill="#7DD3FC" /><circle cx="371" cy="171" r="10" fill="none" stroke="#487891"/><line x1="24" y1="284" x2="396" y2="284" stroke="#253347" /><text x="24" y="313" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">03 / UNDERSTAND</text><text x="24" y="347" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">Models &amp; workflows</text><text x="24" y="375" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Mathematical modelling</text><text x="24" y="397" fill="#A7B6CA" font-family="Arial, Helvetica, sans-serif" font-size="15" >Reproducible bioinformatics</text><circle cx="371" cy="313" r="4" fill="#7DD3FC" /><circle cx="371" cy="313" r="10" fill="none" stroke="#487891"/>
</svg>
